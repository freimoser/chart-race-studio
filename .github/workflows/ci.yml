name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  # Der Kern ist gemeinsam: Jede Änderung muss beide Seiten bauen.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [tiermedizin, humanmedizin]
    env:
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
