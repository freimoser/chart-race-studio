name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Die Seite läuft seit 28.09.2026 unter der eigenen Domain tiermedizin-in-zahlen.org, also im
        # Wurzelpfad. Alte Links auf freimoser.github.io/chart-race-studio/… leitet GitHub dorthin um.
        #
        # VITE_SITE_URL ist keine Kosmetik: Ohne sie entstehen weder Canonical noch sitemap.xml,
        # robots.txt oder llms.txt. Als Repository-Variable hinterlegt
        # (Settings -> Secrets and variables -> Actions -> Variables).
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
        run: BASE_PATH="/" npm run build

      - name: Livegang-Prüfung
        # Läuft gegen den Build. Bricht bei Blockern ab, damit keine Seite ohne
        # ladungsfähige Anschrift oder mit widersprüchlichem Canonical live geht.
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
        run: npm run check:launch
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
